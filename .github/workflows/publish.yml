name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*' # Triggers on semantic version tags like v5.0.1, v5.0.1+1, v5.0.2-beta

# Minimum permissions required for OIDC authentication
permissions:
  contents: read # To check out the repository
  id-token: write # To request the OIDC token from GitHub's OIDC provider

jobs:
  publish:
    name: Publish Package
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Setup Dart SDK (OIDC Authentication)
        uses: dart-lang/setup-dart@v1

      - name: Install Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Publish Package
        run: dart pub publish --force
